<div class="modern-layout">
  <!-- Animated Background -->
  <div class="background-container">
    <div class="gradient-bg"></div>
    <div class="floating-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
    </div>
  </div>

  <!-- Modern Header -->
  <header class="modern-header">
    <div class="header-content">
      <!-- Logo Section -->
      <div class="logo-section">
        <div class="logo">
          <mat-icon class="logo-icon">smart_toy</mat-icon>
          <div class="logo-text">
            <h1>AI Recruiter</h1>
            <span class="logo-subtitle">Intelligent Hiring Solutions</span>
          </div>
        </div>
      </div>

      <!-- Navigation -->
      <nav class="main-navigation">
        <div class="nav-items">
          <button
            *ngFor="let item of navigationItems"
            mat-button
            [class.active]="item.active"
            (click)="navigateTo(item.route)"
            class="nav-button">
            <mat-icon>{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </button>
        </div>
      </nav>

      <!-- User Actions -->
      <div class="user-actions">
        <button mat-icon-button
                matTooltip="Notifications"
                class="action-btn">
          <mat-icon>notifications</mat-icon>
        </button>

        <button mat-icon-button
                [matMenuTriggerFor]="userMenu"
                matTooltip="User menu"
                class="user-btn">
          <mat-icon>account_circle</mat-icon>
        </button>

        <mat-menu #userMenu="matMenu" class="modern-menu">
          <div class="menu-header">
            <mat-icon class="menu-avatar">account_circle</mat-icon>
          <div class="menu-user-info">
            <span class="menu-user-name">{{ currentUser?.username || 'User' }}</span>
            <span class="menu-user-role">{{ currentUser?.role || 'Recruiter' }}</span>
          </div>
          </div>

          <mat-divider></mat-divider>

          <button mat-menu-item>
            <mat-icon>person</mat-icon>
            Profile Settings
          </button>

          <button mat-menu-item>
            <mat-icon>settings</mat-icon>
            Preferences
          </button>

          <button mat-menu-item>
            <mat-icon>help</mat-icon>
            Help & Support
          </button>

          <mat-divider></mat-divider>

          <button mat-menu-item (click)="logout()" class="logout-item">
            <mat-icon>logout</mat-icon>
            Sign Out
          </button>
        </mat-menu>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-content">
    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
